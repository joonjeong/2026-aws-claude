[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake"
version = "0.9.0"
description = "claude-lab 독립 데이터레이크 수집 CLI — 원천당 자기완결 파일, landing+bronze 랜딩"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6",
    "websockets>=12",
    "yfinance>=0.2",
    "pykrx>=1.0",
]

[project.scripts]
# 명령 = 원천(source) 단위, 파일 하나가 자기완결 (fetch→파싱→landing·bronze)
datalake-usgs-feed = "datalake.usgs_feed:main"
datalake-rss = "datalake.rss:main"
datalake-youtube = "datalake.youtube:main"
datalake-adsblol = "datalake.adsblol:main"
datalake-opensky = "datalake.opensky:main"
datalake-aisstream = "datalake.aisstream:main"
datalake-yfinance = "datalake.yfinance:main"
datalake-pykrx = "datalake.pykrx:main"
datalake-gdelt = "datalake.gdelt:main"
datalake-maintenance = "datalake.maintenance:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["datalake"]

[tool.setuptools.package-data]
datalake = ["*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
