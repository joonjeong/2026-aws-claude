[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake"
version = "0.3.0"
description = "claude-lab 독립 데이터레이크 수집기 — 소스별 one-shot CLI, 스케줄링은 외부 오케스트레이터(Temporal 예정) 소유"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6",
    "websockets>=12",
    "pyarrow>=17",
]

[project.optional-dependencies]
market = ["yfinance>=0.2", "pykrx>=1.0"]

[project.scripts]
datalake-quake = "datalake.cli.quake:main"
datalake-news = "datalake.cli.news:main"
datalake-trend = "datalake.cli.trend:main"
datalake-contrail = "datalake.cli.contrail:main"
datalake-wake = "datalake.cli.wake:main"
datalake-market = "datalake.cli.market:main"
datalake-flashpoint = "datalake.cli.flashpoint:main"
datalake-normalize = "datalake.cli.normalize:main"
datalake-maintenance = "datalake.cli.maintenance:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["datalake", "datalake.core", "datalake.sources", "datalake.cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
