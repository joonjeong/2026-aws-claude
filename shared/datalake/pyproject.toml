[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake"
version = "0.1.0"
description = "claude-lab 독립 데이터레이크 수집기 — hub와 동일 소스의 원본을 그대로 적재"
requires-python = ">=3.11"
dependencies = [
    "labkit",
    "httpx>=0.27",
    "feedparser>=6",
    "websockets>=12",
]

[project.optional-dependencies]
market = ["yfinance>=0.2", "pykrx>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
labkit = { path = "../", editable = true }

[tool.setuptools]
packages = ["datalake", "datalake.core", "datalake.sources"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
